services:
  app:
    image: raipple-saas:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET required}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-flash}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD:-admin}
      - SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL:-admin@clausr.ai}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - raipple-data:/app/data
      - ./skills:/app/skills:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  raipple-data:
  caddy-data:
  caddy-config:
