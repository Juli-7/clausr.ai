services:
  app:
    build:
      context: ..
      dockerfile: raipple-saas/Dockerfile
      target: app-builder
    image: raipple-saas:dev
    command: ["pnpm", "--filter", "@raipple/clausr", "dev"]
    environment:
      - NODE_ENV=development
    volumes:
      - ./apps/clausr/src:/app/raipple-saas/apps/clausr/src
      - ./apps/clausr/public:/app/raipple-saas/apps/clausr/public
      - ./apps/clausr/next.config.ts:/app/raipple-saas/apps/clausr/next.config.ts
      - ./packages/platform-core/src:/app/raipple-saas/packages/platform-core/src
      - ../clausr.ai/packages/engine/src:/app/clausr.ai/packages/engine/src
      - raipple-data:/app/data
      - ./skills:/app/skills:ro
    healthcheck:
      disable: true
    ports:
      - "3000:3000"
